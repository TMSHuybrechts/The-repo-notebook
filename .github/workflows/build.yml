# Builds the desktop app for Windows, macOS and Linux. Every push/PR runs the
# tests and a build on all three; a tag like v0.2.0 also attaches the
# installers to a draft GitHub release for a final look before publishing.
#
# Builds are unsigned: Windows shows SmartScreen's "More info → Run anyway",
# macOS needs right-click → Open the first time (or
# `xattr -dr com.apple.quarantine "Repo Notebook.app"`). Signing needs paid
# certificates; wire them in later via CSC_LINK / CSC_KEY_PASSWORD secrets.
name: Build desktop app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
        env:
          RN_SKIP_SHELL_PATH: "1"

      # electron-builder packages dist/ as-is; without this step the
      # installers ship an app with no UI.
      - name: Build web app
        run: npm run build

      - name: Build installers
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No certificates on CI: skip code signing instead of failing.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Download Electron binaries for both arches on the mac runner.
          npm_config_audit: "false"
          npm_config_fund: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repo-notebook-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Draft release with all installers
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.tar.gz
